<script>
/* ============================================================================
   2.  compute()  —  GENERIC. Derives every figure from auditData.inputs by
   evaluating the model's formula list. NO vertical's arithmetic lives here.
   ----------------------------------------------------------------------------
   Each entry in d.model.compute is { name, expr } where expr is a safe RPN
   (Reverse Polish Notation) token list. A token is:
     - an operator: "*", "/", "+", "-"  (pop 2, apply, push)
     - a numeric literal: e.g. "12", "52", "0.6"
     - a name: an inputs[key] OR a previously-computed value
   This evaluator is pure arithmetic over named values — no eval(), no model
   math baked in. The same routine produces the numbers the generator prints
   and the numbers the page renders, so they can never disagree.
   ============================================================================ */
function compute(d) {
  const i = d.inputs;
  const out = {};
  const OPS = {
    "*": (a, b) => a * b,
    "/": (a, b) => a / b,
    "+": (a, b) => a + b,
    "-": (a, b) => a - b
  };
  const resolve = (tok) => {
    if (Object.prototype.hasOwnProperty.call(out, tok)) return out[tok];
    if (i && Object.prototype.hasOwnProperty.call(i, tok)) return i[tok];
    const n = Number(tok);
    if (!Number.isNaN(n) && tok.trim() !== "") return n;
    throw new Error("compute(): unknown token in formula: " + tok);
  };
  (d.model.compute || []).forEach(step => {
    const stack = [];
    step.expr.forEach(tok => {
      if (OPS[tok]) {
        const b = stack.pop(), a = stack.pop();
        stack.push(OPS[tok](a, b));
      } else {
        stack.push(resolve(tok));
      }
    });
    out[step.name] = stack.pop();
  });

  // ---- Totals (driven entirely by the model, not by vertical literals) ----
  const partials = out;
  const totalRecoverableRevenue = (d.model.revenueLedgerKeys || [])
    .reduce((s, k) => s + (partials[k] || 0), 0);
  const marginKey = d.model.marginInput || "grossMargin";
  const totalRecoverableProfit = totalRecoverableRevenue * (i[marginKey] || 0);
  const adminHoursKey = d.model.adminHoursKey || "adminHoursPerYear";
  const hoursReclaimedPerWeek = i.adminHoursPerWeek;

  return Object.assign({}, partials, {
    totalRecoverableRevenue,
    totalRecoverableProfit,
    hoursReclaimedPerWeek,
    _adminHoursKey: adminHoursKey
  });
}
if (window.auditData) { auditData.computed = compute(auditData); }
</script>

    font-family:"JetBrains Mono",monospace; font-weight:700; letter-spacing:.06em;
    font-size:.72rem; color:var(--paper); background:var(--ink);
    padding:.3rem .55rem; display:inline-block; line-height:1;
  }
  .ticket--copper{ background:var(--copper); }
  .ticket--cool{ background:var(--cool); }

  .eyebrow{
    font-family:"JetBrains Mono",monospace; letter-spacing:.28em;
    text-transform:uppercase; font-size:.7rem; color:var(--steel); font-weight:500;
  }

  /* Hairline divider used throughout */
  .rule{ height:1px; background:var(--line); border:0; }
  .rule-ink{ height:2px; background:var(--ink); border:0; }

  /* The fixed left rail with the running ticket + progress line */
  .rail{ position:fixed; left:0; top:0; bottom:0; width:64px; z-index:40;
         border-right:1px solid var(--line); background:var(--paper);
         display:flex; flex-direction:column; align-items:center; }
  .rail-mark{ writing-mode:vertical-rl; transform:rotate(180deg);
         font-family:"JetBrains Mono",monospace; font-size:.7rem; letter-spacing:.22em;
         color:var(--steel); text-transform:uppercase; margin-top:1.25rem; }
  .rail-prog-track{ flex:1; width:1px; background:var(--line); margin:1.25rem 0; position:relative; }
  .rail-prog-fill{ position:absolute; top:0; left:-1px; width:3px; background:var(--copper); height:0; }
  .rail-foot{ font-family:"JetBrains Mono",monospace; font-size:.62rem; color:var(--steel);
         writing-mode:vertical-rl; transform:rotate(180deg); margin-bottom:1.25rem; letter-spacing:.12em; }

  /* Big computed figure styling */
  .figure-xl{ font-family:"Archivo Expanded","Archivo",sans-serif; font-weight:900;
         line-height:.92; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }

  /* Opportunity card */
  .card{ background:#fff; border:1px solid var(--line); position:relative; }
  .card-tag{ position:absolute; top:-1px; left:1.5rem; }

  /* ROI ledger rows */
  .ledger-row{ display:grid; grid-template-columns: 1fr auto; gap:1rem; align-items:baseline;
        padding:.7rem 0; border-bottom:1px dashed var(--line); }
  .ledger-row .lbl{ font-family:"Newsreader",serif; font-size:1.02rem; }
  .ledger-row .val{ font-family:"JetBrains Mono",monospace; font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ledger-op{ font-family:"JetBrains Mono",monospace; font-size:.7rem; color:var(--steel);
        text-transform:uppercase; letter-spacing:.16em; }

  /* Reveal-on-scroll (respects reduced motion) */
  .reveal{ opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease; }
  .reveal.in{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .reveal{ opacity:1; transform:none; transition:none; }
    .gauge-needle{ transition:none !important; }
  }

  /* Cover gauge needle animation */
  .gauge-needle{ transform-box: fill-box; transform-origin: 50% 92%;
        transition: transform 1.8s cubic-bezier(.16,1,.3,1); }

  a:focus-visible, button:focus-visible{ outline:3px solid var(--cool); outline-offset:3px; }

  /* ======================= PRINT (PDF) ======================= */
  @page{ margin:18mm 16mm; }
  @media print{
    html,body{ background:#fff !important; color:#000 !important; }
    .rail, .no-print{ display:none !important; }
    .print-pad{ padding-left:0 !important; }
    .reveal{ opacity:1 !important; transform:none !important; }
    section{ break-inside:avoid-page; }
    .page-break{ break-before:page; }
    .avoid-break{ break-inside:avoid; }
    .card{ border:1px solid #999 !important; box-shadow:none !important; }
    .ticket{ background:#000 !important; color:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .ticket--copper, .ticket--cool{ background:#000 !important; }
    /* keep the key accents legible/printable in color, but safe in B&W */
    .fig-loss{ color:#000 !important; text-decoration:underline; text-decoration-color:#000; text-underline-offset:4px; }
    .fig-copper{ color:#000 !important; }
    .cover-dark{ background:#fff !important; color:#000 !important; }
    .cover-dark .eyebrow, .cover-dark .u-mono, .cover-dark p, .cover-dark span{ color:#222 !important; }
    a{ color:#000 !important; text-decoration:underline; }
    .gauge-needle{ transform: rotate(38deg) !important; }
    .no-break-after{ break-after:avoid; }
    h1,h2,h3{ break-after:avoid; }
  }
</style>
</head>

<body class="font-serif">

  <!-- LEFT RAIL (screen only) -->
  <aside class="rail no-print" aria-hidden="true">
    <div class="rail-mark" id="railMark">BELKEN&nbsp;AI</div>
    <div class="rail-prog-track"><div class="rail-prog-fill" id="railFill"></div></div>
    <div class="rail-foot" id="railFoot">AUDIT</div>
  </aside>

  <!-- App mounts here; everything is rendered by JS from auditData -->
  <main id="app" class="print-pad" style="padding-left:64px;"></main>

<script>
/* ============================================================================
   3.  RENDER  —  build the whole DOM from auditData. No business value below
       is hardcoded; everything reads from `d` / `c` / `d.model`.
   ============================================================================ */
(function(){
  const d = window.auditData;
  if (!d) {
    // No data injected (template opened standalone). Render nothing real so the
    // file holds zero business values in static markup.
    document.getElementById("app").innerHTML =
      '<div style="max-width:640px;margin:14vh auto;padding:0 1.5rem;font-family:Newsreader,serif;color:#5B6470;">' +
      '<div style="font-family:JetBrains Mono,monospace;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;margin-bottom:1rem;">BelKen AI · Engine Template</div>' +
      '<p style="font-size:1.15rem;line-height:1.6;">This is the audit generator template. It renders a finished report only when ' +
      'an <code>auditData</code> object is injected by <code>generate.mjs</code>. Run the generator to produce a client report.</p></div>';
    return;
  }
  const c = d.computed;

  // ---- formatting helpers --------------------------------------------------
  const usd0 = n => "$" + Math.round(n).toLocaleString("en-US");
  const usdK = n => {                       // compact: $112,000 -> "$112K"
    const r = Math.round(n);
    return r >= 1000 ? "$" + Math.round(r/1000) + "K" : "$" + r;
  };
  const num0 = n => Math.round(n).toLocaleString("en-US");
  const num1 = n => (Math.round(n*10)/10).toLocaleString("en-US");
  const pct  = n => Math.round(n*100) + "%";
  const byKey = k => k ? c[k] : null;       // resolve a compute() key for copy

  // managed plan annual cost (for the "vs the Retainer" multiple). Data-driven
  // from pricing.managedMonthly (start of BelKen's Autonomous Operations Retainer, $4,500/mo).
  const managedMonthly = (d.pricing && d.pricing.managedMonthly) || 4500;
  const managedAnnual  = managedMonthly * 12;

  // section registry for the rail/nav
  const sections = [
    {id:"cover",  tag:"00", label:"Cover"},
    {id:"losing", tag:"01", label:"Losing Money"},
    {id:"roi",    tag:"02", label:"ROI"},
    {id:"map",    tag:"03", label:"Opportunity Map"},
    {id:"plan",   tag:"04", label:"4-Day Plan"},
    {id:"stack",  tag:"05", label:"Stack & Pricing"},
    {id:"why",    tag:"06", label:"Why BelKen"},
    {id:"next",   tag:"07", label:"Next Step"},
    {id:"method", tag:"08", label:"Methodology"}
  ];

  // shared section-header block (ticket tag + eyebrow + title)
  function head(tag, eyebrow, title, accent){
    const cls = accent === "copper" ? "ticket ticket--copper" : accent === "cool" ? "ticket ticket--cool" : "ticket";
    return `
      <div class="flex items-center gap-3 mb-5">
        <span class="${cls}">${tag}</span>
        <span class="eyebrow">${eyebrow}</span>
      </div>
      <h2 class="u-display text-3xl md:text-[2.6rem] font-extrabold leading-[1.02] tracking-tight max-w-3xl mb-8 no-break-after">${title}</h2>
    `;
  }

  const wrap = "max-w-5xl mx-auto px-6 md:px-12";

  /* ---------------------------------------------------------------- COVER -- */
  const cover = `
  <section id="cover" data-tag="00" class="cover-dark relative" style="background:var(--ink); color:var(--paper); min-height:100vh;">
    <div class="${wrap} pt-12 pb-16" style="min-height:100vh; display:flex; flex-direction:column;">
      <!-- masthead -->
      <div class="flex items-center justify-between border-b border-white/15 pb-5">
        <div class="u-display font-extrabold tracking-tight text-lg">BelKen<span style="color:var(--copper)">.</span>AI</div>
        <div class="u-mono text-[.7rem]" style="color:#9aa0a8; letter-spacing:.14em;">
          REPORT&nbsp;${d.business.reportId} &middot; ${d.business.reportDate.toUpperCase()}
        </div>
      </div>

      <!-- hero -->
      <div class="flex-1 grid md:grid-cols-[1.15fr_.85fr] gap-10 items-center py-12">
        <div>
          <div class="eyebrow mb-6" style="color:var(--copper)">${d.framing.eyebrow}</div>
          <h1 class="u-display font-black leading-[.95] tracking-tight"
              style="font-size:clamp(2.5rem,6vw,4.4rem);">
            ${d.business.name}
          </h1>
          <p class="u-mono mt-4 text-sm" style="color:#9aa0a8; letter-spacing:.08em;">
            ${d.business.locationCity}, ${d.business.locationState} &nbsp;&middot;&nbsp; ${d.business.segment} &nbsp;&middot;&nbsp; ${d.business.fleet} ${d.business.unitNoun}
          </p>
          <p class="u-serif mt-8 text-lg md:text-xl leading-relaxed max-w-xl" style="color:#d7d3ca;">
            ${d.framing.coverPromise}
          </p>
          <div class="mt-9 u-mono text-[.72rem]" style="color:#7c828b; letter-spacing:.1em;">
            PREPARED FOR ${d.business.preparedFor.toUpperCase()} &nbsp;/&nbsp; PREPARED BY BELKEN AI
          </div>
        </div>

        <!-- SIGNATURE: the leak gauge — recoverable revenue as a manometer reading -->
        <div class="flex justify-center md:justify-end">
          ${gaugeSVG(c.totalRecoverableRevenue)}
        </div>
      </div>

      <!-- bottom: the two headline stats -->
      <div class="grid grid-cols-2 gap-px border-t border-white/15 pt-8" style="border-color:rgba(255,255,255,.15)">
        <div class="pr-6">
          <div class="eyebrow mb-2" style="color:#7c828b;">Recoverable / year</div>
          <div class="figure-xl fig-copper" style="color:var(--copper); font-size:clamp(2rem,4.5vw,3.1rem);">${usd0(c.totalRecoverableRevenue)}</div>
          <div class="u-mono text-[.7rem] mt-2" style="color:#9aa0a8;">≈ ${usd0(c.totalRecoverableProfit)} in gross profit at ${pct(d.inputs[d.model.marginInput || "grossMargin"])} margin</div>
        </div>
        <div class="pl-6 border-l border-white/15" style="border-color:rgba(255,255,255,.15)">
          <div class="eyebrow mb-2" style="color:#7c828b;">Hours reclaimed / week</div>
          <div class="figure-xl" style="color:var(--paper); font-size:clamp(2rem,4.5vw,3.1rem);">${num0(c.hoursReclaimedPerWeek)} hrs</div>
          <div class="u-mono text-[.7rem] mt-2" style="color:#9aa0a8;">${num0(c[c._adminHoursKey])} office hours back per year</div>
        </div>
      </div>
    </div>
  </section>

  <!-- EXECUTIVE SUMMARY -->
  <section id="exec" data-tag="00" class="py-16 md:py-24">
    <div class="${wrap}">
      ${head("00", "Executive Summary", "Demand isn't your problem. Leakage is.", "copper")}
      <div class="grid md:grid-cols-[1fr_320px] gap-10">
        <p class="u-serif text-xl md:text-[1.45rem] leading-relaxed text-ink/90">${d.framing.execSummary}</p>
        <div class="border-l-2 pl-6" style="border-color:var(--copper)">
          <div class="eyebrow mb-3">The headline</div>
          <p class="u-serif text-lg leading-snug mb-4">An estimated <strong class="fig-copper" style="color:var(--copper)">${usd0(c.totalRecoverableRevenue)}/yr</strong> is recoverable, plus <strong>${num0(c.hoursReclaimedPerWeek)} hours a week</strong> of front-office time, ${d.framing.execHeadlineClause}.</p>
          <p class="u-mono text-[.7rem] text-steel leading-relaxed">Every figure in this report is derived from your operating inputs. See the ROI page for the arithmetic and the appendix for assumptions.</p>
        </div>
      </div>
    </div>
  </section>
  `;

  /* --------------------------------------------------- 01  LOSING MONEY ---- */
  const painCards = d.pains.map(p => {
    const amt = byKey(p.amountKey);
    const amtBlock = amt
      ? `<div class="mt-4 flex items-baseline gap-3">
           <span class="figure-xl fig-loss" style="color:var(--loss); font-size:1.9rem;">${usd0(amt)}</span>
           <span class="u-serif text-sm text-steel leading-snug">${p.amountLabel}</span>
         </div>`
      : `<div class="mt-4 u-mono text-[.72rem] text-steel leading-relaxed border-t border-line pt-3">${p.amountLabel}</div>`;
    return `
      <div class="avoid-break py-7 border-b border-line grid md:grid-cols-[88px_1fr] gap-5">
        <div><span class="ticket ticket--cool">${p.tag}</span></div>
        <div>
          <h3 class="u-display text-xl font-bold tracking-tight mb-2">${p.title}</h3>
          <p class="u-serif text-lg leading-relaxed text-ink/85 max-w-2xl">${p.body}</p>
          ${amtBlock}
        </div>
      </div>`;
  }).join("");

  const losing = `
  <section id="losing" data-tag="01" class="page-break py-16 md:py-24" style="background:#fff;">
    <div class="${wrap}">
      ${head("01", "The Diagnosis", "Where you're losing money right now", "cool")}
      <p class="u-serif text-lg text-ink/80 max-w-2xl mb-4 -mt-3">${d.framing.painsIntro}</p>
      ${painCards}
    </div>
  </section>
  `;

  /* ------------------------------------------------------------- 02  ROI --- */
  const i = d.inputs;

  // resolve {{usd:key}} / {{usdK:key}} / {{num0:key}} tokens embedded in a ledger
  // row label so per-vertical labels can reference an input value without
  // hardcoding it (e.g. "service @ {{usd:avgServiceTicket}}").
  function resolveLabel(label){
    return String(label).replace(/\{\{(usd|usdK|num0|pct):([a-zA-Z0-9_]+)\}\}/g, (m, fmt, key) => {
      const v = i[key];
      if (v === undefined) return m;
      if (fmt === "usd")  return usd0(v);
      if (fmt === "usdK") return usdK(v);
      if (fmt === "num0") return num0(v);
      if (fmt === "pct")  return pct(v);
      return m;
    });
  }

  // value formatter for a ledger row (data-driven; emits the same strings the
  // hand-built ledgers printed). 'rate' appends "/hr loaded"; 'suffix' is free
  // text; 'mix' prints a "$lo–$hiK" range from two input keys.
  function fmtVal(row){
    if (row.kind === "mix"){
      return usd0(i[row.lo]) + " to " + usdK(i[row.hi]);
    }
    // a row may print a COMPUTED total as its value (e.g. the admin block's
    // bottom line shows the annual cost) while the rate lives in the label.
    if (row.totalKey){
      return usd0(c[row.totalKey]);
    }
    const raw = row.kind === "input" ? i[row.key] : c[row.expr];
    let v;
    switch(row.fmt){
      case "pct":  v = pct(raw); break;
      case "num0": v = num0(raw); break;
      case "num1": v = num1(raw); break;
      case "usd":  v = usd0(raw); break;
      case "hrs":  v = num0(raw) + " hrs"; break;
      default:     v = String(raw);
    }
    if(row.rate) v += "/hr loaded";
    if(row.suffix) v += row.suffix;
    return v;
  }
  // render one ledger row -> identical markup to the hand-built .ledger-row variants
  function ledgerRow(row, opts){
    opts = opts || {};
    const op = row.op ? `<span class="ledger-op">${row.op}</span> ` : "";
    const lblStyle = row.indent ? ' style="padding-left:1rem;"' : "";
    const lblCls = row.strong ? "lbl font-semibold" : "lbl";
    const lblText = (row.indent ? "↳ " : "") + resolveLabel(row.label);
    const val = fmtVal(row);
    if(row.total){
      // bottom-line "Annual" row: heavy underline + copper for revenue, ink for cost
      const valCls = opts.cost ? "val" : "val fig-copper";
      const valStyle = opts.cost ? 'style="font-weight:700;"' : 'style="color:var(--copper); font-weight:700;"';
      return `<div class="ledger-row" style="border-bottom:2px solid var(--ink);"><span class="${lblCls}">${op}${lblText}</span><span class="${valCls}" ${valStyle}>${val}</span></div>`;
    }
    return `<div class="ledger-row"><span class="${lblCls}"${lblStyle}>${op}${lblText}</span><span class="val">${val}</span></div>`;
  }
  // render a full ledger block (ticket tag + title + rows)
  function ledgerBlock(L, opts){
    const rows = L.rows.map(r => ledgerRow(r, opts)).join("");
    return `
          <div class="flex items-center gap-3 mb-4${opts && opts.spaced ? ' mt-10':''}">
            <span class="ticket">${L.code}</span>
            <h3 class="u-display text-lg font-bold tracking-tight">${L.title}</h3>
          </div>
          ${rows}`;
  }

  // Column layout mirrors the hand-built A | (B+C…) arrangement: first revenue
  // ledger alone on the left; the rest of the revenue ledgers + the admin ledger
  // stacked on the right. Fully driven by auditData.model — add/remove a ledger
  // there and this re-renders with no edits here.
  const Ls = d.model.ledgers;
  const leftCol  = `<div class="avoid-break">${ledgerBlock(Ls[0])}</div>`;
  const rightStack = Ls.slice(1).map((L,idx) => ledgerBlock(L, idx>0 ? {spaced:true} : {})).join("");
  const adminBlk = ledgerBlock(d.model.adminLedger, {spaced: Ls.length>1, cost:true});
  const rightCol = `<div class="avoid-break">${rightStack}${adminBlk}</div>`;

  const adminHoursKey = c._adminHoursKey;
  const adminCostKey  = d.model.adminCostKey || "adminAnnualCost";

  const roi = `
  <section id="roi" data-tag="02" class="page-break py-16 md:py-24">
    <div class="${wrap}">
      ${head("02", "The Arithmetic", "What that leak is worth, shown not asserted", "copper")}
      <p class="u-serif text-lg text-ink/80 max-w-2xl mb-10 -mt-3">No black box. Here is every step from your inputs to the recoverable figure on the cover. Change an input on our call and the total moves with it.</p>

      <div class="grid lg:grid-cols-2 gap-x-14 gap-y-12">
        ${leftCol}
        ${rightCol}
      </div>

      <!-- TOTAL -->
      <div class="avoid-break mt-14 p-8 md:p-10" style="background:var(--ink); color:var(--paper);">
        <div class="grid md:grid-cols-[1fr_auto] gap-8 items-end">
          <div>
            <div class="eyebrow mb-3" style="color:var(--copper)">${d.model.revenueLabel}</div>
            <div class="figure-xl fig-copper" style="color:var(--copper); font-size:clamp(2.6rem,7vw,4.5rem);">${usd0(c.totalRecoverableRevenue)}<span class="u-mono text-base align-top" style="color:#9aa0a8;"> / yr</span></div>
            <p class="u-mono text-[.74rem] mt-4 leading-relaxed" style="color:#9aa0a8; max-width:34rem;">
              ≈ ${usd0(c.totalRecoverableProfit)} in gross profit at a ${pct(i[d.model.marginInput || "grossMargin"])} blended margin, plus ${num0(c[adminHoursKey])} office hours (${usd0(c[adminCostKey])}) returned to capacity. Conservative by design. See the appendix.
            </p>
          </div>
          <div class="text-right">
            <div class="eyebrow mb-2" style="color:#7c828b;">vs. the Retainer</div>
            <div class="u-mono text-sm" style="color:#d7d3ca;">${usd0(managedMonthly)} / mo = ${usd0(managedAnnual)} / yr</div>
            <div class="figure-xl mt-2" style="color:var(--paper); font-size:2.2rem;">${(c.totalRecoverableRevenue/managedAnnual).toFixed(1)}×</div>
            <div class="u-mono text-[.7rem] mt-1" style="color:#7c828b;">recoverable revenue ÷ cost</div>
          </div>
        </div>
      </div>
    </div>
  </section>
  `;

  /* ------------------------------------------------ 03  OPPORTUNITY MAP ---- */
  const oppCards = d.opportunities.map(o => {
    const saves = byKey(o.savesKey);
    const hours = byKey(o.hoursKey);
    const savesLine = saves
      ? `<div class="figure-xl fig-copper" style="color:var(--copper); font-size:1.7rem;">${usd0(saves)}<span class="u-mono text-xs" style="color:var(--steel)"> / yr</span></div>`
      : `<div class="u-display text-lg font-bold">${o.hoursNote || ""}</div>`;
    const hoursLine = hours
      ? `<div class="u-mono text-[.74rem] text-steel mt-1">+ ${num0(hours)} hrs/yr reclaimed</div>`
      : (saves && o.hoursNote ? `<div class="u-mono text-[.74rem] text-steel mt-1">${o.hoursNote}</div>` : ``);
    return `
    <div class="card avoid-break p-7 pt-9">
      <span class="card-tag ticket ticket--copper">${o.tag}</span>
      <div class="grid md:grid-cols-[1fr_220px] gap-7">
        <div>
          <div class="eyebrow mb-2" style="color:var(--cool)">Our solution &middot; ${o.solution}</div>
          <h3 class="u-display text-2xl font-extrabold tracking-tight leading-tight mb-3">${o.title}</h3>
          <p class="u-serif text-lg leading-relaxed text-ink/85 mb-4">${o.what}</p>
          <div class="u-mono text-[.72rem] text-steel border-t border-line pt-3" style="letter-spacing:.04em;">▸ ${o.maps}</div>
        </div>
        <div class="md:border-l md:pl-7 border-line grid grid-cols-2 md:grid-cols-1 gap-5 content-start">
          <div>
            <div class="eyebrow mb-1">What it saves</div>
            ${savesLine}${hoursLine}
          </div>
          <div>
            <div class="eyebrow mb-1">What it costs</div>
            <div class="u-serif text-base font-semibold leading-snug">${o.cost}</div>
          </div>
          <div>
            <div class="eyebrow mb-1">Setup time</div>
            <div class="u-mono text-sm">${o.setup}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  const map = `
  <section id="map" data-tag="03" class="page-break py-16 md:py-24" style="background:#fff;">
    <div class="${wrap}">
      ${head("03", "The Fix", "Your AI opportunity map", "copper")}
      <p class="u-serif text-lg text-ink/80 max-w-2xl mb-10 -mt-3">Each leak maps to one thing BelKen runs for you. You don't buy tools or wire anything together. We operate the agent and you get the booked jobs.</p>
      <div class="grid gap-6">${oppCards}</div>
    </div>
  </section>
  `;

  /* --------------------------------------------------- 04  4-DAY PLAN ------ */
  const planSteps = d.quickWins.map((w,idx) => `
    <div class="avoid-break grid md:grid-cols-[120px_1fr] gap-5 py-7 ${idx < d.quickWins.length-1 ? 'border-b border-line':''}">
      <div>
        <div class="u-display font-black text-3xl tracking-tight" style="color:var(--copper)">${w.day}</div>
      </div>
      <div>
        <h3 class="u-display text-xl font-bold tracking-tight mb-2">${w.title}</h3>
        <p class="u-serif text-lg leading-relaxed text-ink/85 max-w-2xl">${w.detail}</p>
      </div>
    </div>`).join("");

  const plan = `
  <section id="plan" data-tag="04" class="page-break py-16 md:py-24">
    <div class="${wrap}">
      ${head("04", "Onboarding", "Your first four days with BelKen", "copper")}
      <p class="u-serif text-lg text-ink/80 max-w-2xl mb-6 -mt-3">From signed to answering calls in four working days. Your phone number and your team stay exactly as they are.</p>
      <div>${planSteps}</div>
    </div>
  </section>
  `;

  /* ----------------------------------------------- 05  STACK & PRICING ----- */
  const tiers = (d.pricing.tiers || d.pricing).map(t => {
    const hi = t.highlight;
    const base = hi ? "background:var(--ink); color:var(--paper);" : "background:#fff;";
    const badge = t.badge ? `<span class="ticket ticket--copper absolute -top-3 left-6">${t.badge}</span>` : "";
    const ctaBtn = t.cta
      ? `<a href="${d.cta.calendly}" class="no-print inline-block mt-5 u-mono text-[.74rem] font-bold tracking-wide px-4 py-2.5" style="background:var(--copper); color:#fff; letter-spacing:.06em;">BOOK A CALL →</a>`
      : "";
    return `
    <div class="card avoid-break relative p-6 ${hi ? '':'border-line'}" style="${base} ${hi?'border-color:var(--ink)':''}">
      ${badge}
      <div class="eyebrow mb-3" style="${hi?'color:var(--copper)':''}">${t.tier}</div>
      <div class="flex items-baseline gap-1 mb-3">
        <span class="figure-xl" style="font-size:1.9rem; ${hi?'color:var(--paper)':'color:var(--ink)'}">${t.price}</span>
        <span class="u-mono text-xs" style="color:${hi?'#9aa0a8':'var(--steel)'}">${t.cadence}</span>
      </div>
      <p class="u-serif text-[.98rem] leading-snug" style="${hi?'color:#d7d3ca':'color:var(--ink)'};opacity:.9;">${t.blurb}</p>
      ${ctaBtn}
    </div>`;
  }).join("");

  const stack = `
  <section id="stack" data-tag="05" class="page-break py-16 md:py-24" style="background:#fff;">
    <div class="${wrap}">
      ${head("05", "The Ladder", "Recommended stack & pricing", "cool")}
      <p class="u-serif text-lg text-ink/80 max-w-2xl mb-10 -mt-3">${d.framing.pricingIntro}</p>
      <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-5 items-stretch">${tiers}</div>
      <p class="u-mono text-[.72rem] text-steel mt-8 max-w-3xl leading-relaxed">Everything in the Opportunity Map (ARIA inbound, ARIA outbound reactivation, scheduling, and the review engine) is included in the Autonomous Operations Retainer. One price, one service, no per-tool fees.</p>
    </div>
  </section>
  `;

  /* ------------------------------------------------- 06  WHY BELKEN -------- */
  const whyRows = d.whyBelken.map(w => `
    <div class="avoid-break grid md:grid-cols-[260px_1fr_1fr] gap-6 py-7 border-b border-line items-start">
      <h3 class="u-display text-xl font-bold tracking-tight">${w.title}</h3>
      <div>
        <div class="eyebrow mb-2" style="color:var(--loss)">Doing it yourself</div>
        <p class="u-serif text-base leading-relaxed text-ink/70">${w.diy}</p>
      </div>
      <div class="md:pl-6 md:border-l border-line">
        <div class="eyebrow mb-2" style="color:var(--copper)">With BelKen</div>
        <p class="u-serif text-base leading-relaxed text-ink/90">${w.belken}</p>
      </div>
    </div>`).join("");

  const why = `
  <section id="why" data-tag="06" class="page-break py-16 md:py-24">
    <div class="${wrap}">
      ${head("06", "The Difference", "Why BelKen, not another tool", "copper")}
      <p class="u-serif text-lg text-ink/80 max-w-2xl mb-4 -mt-3">The alternative to BelKen is not doing nothing. It is going and assembling and running all of this yourself. Here is the honest comparison.</p>
      <div>${whyRows}</div>
    </div>
  </section>
  `;

  /* --------------------------------------------------- 07  NEXT STEP ------- */
  const next = `
  <section id="next" data-tag="07" class="page-break py-20 md:py-28" style="background:var(--ink); color:var(--paper);">
    <div class="${wrap}">
      <div class="flex items-center gap-3 mb-7">
        <span class="ticket ticket--copper">07</span>
        <span class="eyebrow" style="color:#7c828b;">Your Next Step</span>
      </div>
      <h2 class="u-display font-black tracking-tight leading-[.98] mb-7" style="font-size:clamp(2.2rem,6vw,4rem); max-width:18ch;">${d.cta.headline}</h2>
      <p class="u-serif text-xl leading-relaxed mb-10" style="color:#d7d3ca; max-width:42rem;">${d.cta.body}</p>
      <a href="${d.cta.calendly}" class="inline-block u-display font-extrabold tracking-tight text-lg px-9 py-5" style="background:var(--copper); color:#fff;">
        ${d.cta.buttonText} &nbsp;→
      </a>
      <div class="u-mono text-sm mt-6" style="color:#9aa0a8;">${d.cta.calendlyLabel}</div>
      <p class="u-serif text-base mt-8" style="color:#9aa0a8; max-width:42rem;">${d.cta.secondary}</p>
    </div>
  </section>
  `;

  /* -------------------------------------------------- 08  METHODOLOGY ------ */
  const methNotes = d.methodology.notes.map((n,idx) => `
    <div class="avoid-break grid grid-cols-[40px_1fr] gap-4 py-4 border-b border-line">
      <div class="u-mono text-sm text-steel font-bold">${String(idx+1).padStart(2,"0")}</div>
      <p class="u-serif text-base leading-relaxed text-ink/85">${n}</p>
    </div>`).join("");

  // input snapshot table — proves EVERY input the math ran on. Data-driven:
  // uses model.appendixInputs (an ordered {key,label,fmt} list) so the appendix
  // lists all operating inputs for any vertical. Falls back to auto-listing the
  // raw inputs object if a model omits the list.
  function fmtInput(key, fmt, suffix){
    const raw = i[key];
    if (raw === undefined) return "";
    let v;
    switch(fmt){
      case "pct":  v = pct(raw); break;
      case "usd":  v = usd0(raw); break;
      case "hrs":  v = num0(raw) + " hrs"; break;
      case "num1": v = num1(raw); break;
      default:     v = num0(raw);
    }
    return v + (suffix || "");
  }
  let inputRowDefs;
  if (Array.isArray(d.model.appendixInputs) && d.model.appendixInputs.length) {
    inputRowDefs = d.model.appendixInputs
      .filter(a => i[a.key] !== undefined)
      .map(a => [a.label, fmtInput(a.key, a.fmt, a.suffix)]);
  } else {
    // generic fallback: list whatever inputs exist
    inputRowDefs = Object.keys(i).map(k => [k, num0(i[k])]);
  }
  const inputRows = inputRowDefs
    .map(r => `<div class="ledger-row"><span class="lbl">${r[0]}</span><span class="val">${r[1]}</span></div>`).join("");

  const method = `
  <section id="method" data-tag="08" class="page-break py-16 md:py-24" style="background:#fff;">
    <div class="${wrap}">
      ${head("08", "Appendix", "How this audit was built", "cool")}
      <div class="grid lg:grid-cols-[1fr_360px] gap-12">
        <div>
          <p class="u-serif text-lg leading-relaxed text-ink/85 mb-8 max-w-2xl">${d.methodology.intro}</p>
          ${methNotes}
        </div>
        <div class="avoid-break">
          <div class="eyebrow mb-4">Inputs this report ran on</div>
          <div class="border border-line p-5">${inputRows}</div>
          <p class="u-mono text-[.68rem] text-steel mt-4 leading-relaxed">Report ${d.business.reportId} &middot; generated ${d.business.reportDate}. Confirm these on your discovery call and the model recalculates live.</p>
        </div>
      </div>

      <!-- footer -->
      <div class="rule-ink mt-20 mb-6"></div>
      <div class="flex flex-col md:flex-row justify-between gap-4 items-start md:items-center">
        <div class="u-display font-extrabold tracking-tight text-lg">BelKen<span style="color:var(--copper)">.</span>AI</div>
        <div class="u-mono text-[.7rem] text-steel" style="letter-spacing:.1em;">
          AI OPPORTUNITY AUDIT &middot; PREPARED FOR ${d.business.name.toUpperCase()} &middot; ${d.business.reportDate.toUpperCase()}
        </div>
      </div>
    </div>
  </section>
  `;

  /* ---- set document title from data (no hardcoded business name in markup) ---- */
  document.title = `${d.framing.eyebrow}: ${d.business.name} | BelKen AI`;

  /* ---- mount everything ---- */
  document.getElementById("app").innerHTML =
    cover + losing + roi + map + plan + stack + why + next + method;

  /* ---- the cover gauge: an SVG manometer; needle position scales to value ---- */
  function gaugeSVG(value){
    // map value onto a -38°..+38° sweep purely for the dramatic reading; the
    // number printed is the real computed figure, the dial is illustrative.
    return `
    <svg width="290" height="290" viewBox="0 0 290 290" role="img"
         aria-label="Recoverable revenue gauge reading ${usd0(value)} per year" class="select-none">
      <defs>
        <radialGradient id="dialface" cx="50%" cy="42%" r="65%">
          <stop offset="0%" stop-color="#23262d"/><stop offset="100%" stop-color="#101216"/>
        </radialGradient>
      </defs>
      <circle cx="145" cy="145" r="138" fill="url(#dialface)" stroke="#3a3e47" stroke-width="2"/>
      <circle cx="145" cy="145" r="118" fill="none" stroke="#2a2d34" stroke-width="1"/>
      <!-- tick arc -->
      ${(function(){
        let t="";
        for(let k=0;k<=10;k++){
          const a=(-130 + k*26) * Math.PI/180;
          const r1=118, r2=k%5===0?100:108;
          const x1=145+r1*Math.cos(a), y1=145+r1*Math.sin(a);
          const x2=145+r2*Math.cos(a), y2=145+r2*Math.sin(a);
          const col = k>=8 ? "#B45A2B" : "#5B6470";
          t+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${k%5===0?2.4:1.2}"/>`;
        }
        return t;
      })()}
      <!-- red 'loss' zone arc on the high end -->
      <path d="M ${145+112*Math.cos(78*Math.PI/180)} ${145+112*Math.sin(78*Math.PI/180)}
               A 112 112 0 0 1 ${145+112*Math.cos(130*Math.PI/180)} ${145+112*Math.sin(130*Math.PI/180)}"
            fill="none" stroke="#B45A2B" stroke-width="4" stroke-linecap="round" transform="rotate(180 145 145)"/>
      <text x="145" y="92" text-anchor="middle" fill="#7c828b" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2">RECOVERABLE / YR</text>
      <!-- needle (animated from rest to reading) -->
      <g class="gauge-needle" id="needle">
        <polygon points="145,52 150,150 140,150" fill="#B45A2B"/>
        <circle cx="145" cy="150" r="9" fill="#16181D" stroke="#B45A2B" stroke-width="2"/>
      </g>
      <text x="145" y="200" text-anchor="middle" fill="#F7F5F0" font-family="Archivo Expanded, Archivo, sans-serif" font-weight="900" font-size="30">${usdK(value)}</text>
      <text x="145" y="222" text-anchor="middle" fill="#9aa0a8" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">EST. ANNUAL LEAK, SEALED</text>
    </svg>`;
  }

  /* ---- scroll: rail progress + section label + reveals ---- */
  const railFill = document.getElementById("railFill");
  const railMark = document.getElementById("railMark");
  const railFoot = document.getElementById("railFoot");
  const secEls = sections.map(s => document.getElementById(s.id)).filter(Boolean);

  function onScroll(){
    const h = document.documentElement;
    const scrolled = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
    railFill.style.height = (scrolled*100) + "%";
    // active section label
    let active = sections[0];
    for(const s of sections){
      const el = document.getElementById(s.id);
      if(el && el.getBoundingClientRect().top <= window.innerHeight*0.4) active = s;
    }
    railFoot.textContent = active.tag + " " + active.label.toUpperCase();
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();

  // reveal-on-scroll
  const mqReduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  if(!mqReduce.matches){
    document.querySelectorAll("section h2, .card, .ledger-row, .avoid-break").forEach(el => el.classList.add("reveal"));
    const io = new IntersectionObserver((ents)=>{
      ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} });
    },{threshold:0.08});
    document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  }

  // fire the gauge needle after paint
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const n = document.getElementById("needle");
      if(n && !mqReduce.matches){ n.style.transform = "rotate(38deg)"; }
      else if(n){ n.style.transform = "rotate(38deg)"; }
    }, 220);
  });
})();
</script>
</body>
</html>
